# Production stack. Secrets come from /opt/pellora/.env on the server (never from git).
name: pellora

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [client, server, engine]
    logging: *logging

  client:
    image: ${DOCKERHUB_USER}/pellora-client:${TAG:-latest}
    restart: unless-stopped
    depends_on: [server]
    mem_limit: 64m
    logging: *logging

  server:
    image: ${DOCKERHUB_USER}/pellora-server:${TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/skin_portal?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_ORIGIN: https://pellora.cmcloud.online
      ENGINE_URL: http://engine:8000
      ENGINE_KEY: ${ENGINE_KEY}
      BRAND_NAME: Pellora
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      mongo: { condition: service_healthy }
      engine: { condition: service_healthy }
    mem_limit: 200m
    logging: *logging

  engine:
    image: ${DOCKERHUB_USER}/pellora-engine:${TAG:-latest}
    restart: unless-stopped
    environment:
      WORKERS: "1"
      SKIN_API_KEYS: ${ENGINE_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: https://pellora.cmcloud.online
    mem_limit: 450m
    logging: *logging

  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    mem_limit: 400m
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  mongo_data:
